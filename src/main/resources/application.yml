spring:
  profiles:
    default: single-node
  application:
    name: company-check-service
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 250
      validation-timeout: 250
      idle-timeout: 600000
      max-lifetime: 1500000
verification:
  lifetime: 10m
  database:
    transaction-timeout: 5s
    retry:
      max-attempts: 3
      delay: 50ms
      multiplier: 2
      max-delay: 500ms
  expiration:
    reaper-delay: 1000ms
    lock:
      key: "company-check:expiration:lock"
      ttl: 30s
  providers:
    attempt-timeout: 500ms
    pool:
      max-connections-total: 100
      max-connections-per-route: 50
      connection-request-timeout: 100ms
      connect-timeout: 150ms
      response-timeout: 400ms
      validate-after-inactivity: 5s
      evict-idle-after: 30s
    free:
      base-url: "${VERIFICATION_FREE_BASE_URL:http://localhost:8081}"
      path: "${VERIFICATION_FREE_PATH:/free-third-party?query={query}}"
      api-key: "${VERIFICATION_FREE_API_KEY:}"
    premium:
      base-url: "${VERIFICATION_PREMIUM_BASE_URL:http://localhost:8082}"
      path: "${VERIFICATION_PREMIUM_PATH:/premium-third-party?query={query}}"
      api-key: "${VERIFICATION_PREMIUM_API_KEY:}"
  coordination:
    l1-maximum-size: 10000
    ttl: 10m
    match-ttl: 24h
    no-match-ttl: 10m
    jitter: 30s
    lease-ttl: 20s
    waiter-poll: 50ms
    waiter-attempts: 20
    key-prefix: "company-check:"
  rate-limiting:
    key-prefix: "company-check:rate:"
    free:
      limit-for-period: 100
      refresh-period: 1s
    premium:
      limit-for-period: 100
      refresh-period: 1s
  inbound-rate-limiting:
    key-prefix: "company-check:inbound:"
    limit-for-period: 100
    refresh-period: 1s
resilience4j:
  retry:
    aspect-order: 1
    instances:
      freeProvider:
        max-attempts: 2
        wait-duration: 25ms
        retry-exceptions:
          - com.incode.verification.adapter.out.provider.ProviderTransientException
      premiumProvider:
        max-attempts: 2
        wait-duration: 25ms
        retry-exceptions:
          - com.incode.verification.adapter.out.provider.ProviderTransientException
  circuitbreaker:
    aspect-order: 2
    instances:
      freeProvider: { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 10s, permitted-number-of-calls-in-half-open-state: 2 }
      premiumProvider: { sliding-window-size: 20, minimum-number-of-calls: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 10s, permitted-number-of-calls-in-half-open-state: 2 }
  bulkhead:
    aspect-order: 4
    instances:
      freeProvider: { max-concurrent-calls: 50, max-wait-duration: 0 }
      premiumProvider: { max-concurrent-calls: 50, max-wait-duration: 0 }
management:
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4317}
          transport: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT:grpc}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    access:
      max-permitted: read-only
  endpoint:
    health:
      show-details: never
